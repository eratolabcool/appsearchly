<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Search - Find the best apps across all platforms</title>
    <meta name="description" content="Search and discover the best apps for iOS, Android, and web. Compare prices, read reviews, and find alternatives.">

    <!-- SEO Meta Tags -->
    <meta name="keywords" content="app search, mobile apps, iOS apps, Android apps, app alternatives, app reviews, find apps">
    <meta name="author" content="App Search">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="App Search - Find the best apps across all platforms">
    <meta property="og:description" content="Search and discover the best apps for iOS, Android, and web. Compare prices, read reviews, and find alternatives.">
    <meta property="og:image" content="/assets/og-image.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="App Search - Find the best apps across all platforms">
    <meta property="twitter:description" content="Search and discover the best apps for iOS, Android, and web. Compare prices, read reviews, and find alternatives.">
    <meta property="twitter:image" content="/assets/og-image.jpg">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/assets/favicon/favicon.png">

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/assets/favicon/favicon.png">

    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://apps.apple.com">
    <link rel="preconnect" href="https://play.google.com">

    <!-- DNS prefetch for potential external resources -->
    <link rel="dns-prefetch" href="//cdn.apple.com">
    <link rel="dns-prefetch" href="//ssl.gstatic.com">

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#007aff">

    <!-- Apple-specific meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="App Search">

    <!-- Microsoft-specific meta tags -->
    <meta name="msapplication-TileColor" content="#007aff">
    <meta name="msapplication-config" content="/browserconfig.xml">

    <!-- Structured Data for SEO -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "App Search",
        "description": "Search and discover the best apps for iOS, Android, and web. Compare prices, read reviews, and find alternatives.",
        "url": "https://your-domain.com",
        "applicationCategory": "Utilities",
        "operatingSystem": "Web Browser",
        "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
        }
    }
    </script>

    <style>
        /* Critical CSS for preventing FOUC (Flash of Unstyled Content) */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            line-height: 1.5;
        }

        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #f5f5f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }

        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #007aff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 16px;
            color: #86868b;
            margin: 0;
        }

        /* Hide loading screen when app is ready */
        .app-ready .loading-screen {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loading-screen">
        <div class="loading-spinner"></div>
        <p class="loading-text">Loading App Search...</p>
    </div>

    <!-- App Container -->
    <div class="body-container">
        <!-- Svelte app will be mounted here -->
    </div>

    <!-- Application Bundle -->
    <script type="module" src="/src/search-browser.ts"></script>

    <!-- Analytics and Tracking (placeholder) -->
    <script async>
        // Hide loading screen when app is ready
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.body.classList.add('app-ready');
                // Remove loading screen after transition
                setTimeout(function() {
                    const loadingScreen = document.getElementById('loading-screen');
                    if (loadingScreen) {
                        loadingScreen.remove();
                    }
                }, 300);
            }, 500);
        });

        // Error handling
        window.addEventListener('error', function(e) {
            console.error('Application error:', e.error);
            // In production, you might want to send this to an error tracking service
        });

        // Service Worker registration for PWA functionality (future enhancement)
        if ('serviceWorker' in navigator && import.meta.env.PROD) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js')
                    .then(function(registration) {
                        console.log('SW registered: ', registration);
                    })
                    .catch(function(registrationError) {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
    </script>

    <!-- Placeholder for external scripts -->
    <!-- Google Analytics, etc. would go here -->
</body>
</html>
