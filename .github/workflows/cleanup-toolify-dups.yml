name: Cleanup toolify.ai Duplicate Tools

# 一次性数据修复：早期采集器把目录站 toolify.ai 误记为 canonical_domain，
# 生产库积累了 27 条此类脏数据（用户已确认删除）。
# 仅删除 canonical_domain = 'toolify.ai' 的行，FK 级联清理子表。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Delete mis-scraped toolify.ai rows
        run: |
          npm init -y >/dev/null 2>&1
          npm install pg --no-save >/dev/null 2>&1
          node --input-type=module <<'EOF'
          import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL.trim() });
          await client.connect();

          const before = await client.query(
            "SELECT count(*)::int AS n FROM tools WHERE lower(canonical_domain) = 'toolify.ai'"
          );
          console.log(`rows to delete: ${before.rows[0].n}`);

          const del = await client.query(
            "DELETE FROM tools WHERE lower(canonical_domain) = 'toolify.ai'"
          );
          console.log(`deleted: ${del.rowCount}`);

          const after = await client.query(
            "SELECT count(*)::int AS n FROM tools WHERE lower(canonical_domain) = 'toolify.ai'"
          );
          console.log(`remaining: ${after.rows[0].n}`);
          const total = await client.query('SELECT count(*)::int AS n FROM tools');
          console.log(`tools total now: ${total.rows[0].n}`);

          await client.end();
          EOF
