name: Diagnose Tools Domain Duplicates

# 一次性只读诊断： 0006 回填 normalized_domain 时撞唯一索引。
# 列出按 COALESCE(normalized_domain, canonical_domain) 分组的重复行明细。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Print duplicate groups (read-only)
        run: |
          npm init -y >/dev/null 2>&1
          npm install pg --no-save >/dev/null 2>&1
          node --input-type=module <<'EOF'
          import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL.trim() });
          await client.connect();

          const total = await client.query('SELECT count(*)::int AS n, count(*) FILTER (WHERE normalized_domain IS NOT NULL)::int AS with_nd FROM tools');
          console.log(`tools total=${total.rows[0].n}, normalized_domain non-null=${total.rows[0].with_nd}`);

          const dups = await client.query(`
            SELECT COALESCE(normalized_domain, canonical_domain) AS nd, count(*)::int AS n
            FROM tools
            WHERE COALESCE(normalized_domain, canonical_domain) IS NOT NULL
            GROUP BY 1 HAVING count(*) > 1 ORDER BY n DESC LIMIT 20
          `);
          console.log(`duplicate groups: ${dups.rows.length}`);
          for (const g of dups.rows) {
            console.log(`\n=== ${g.nd} (${g.n} rows) ===`);
            const rows = await client.query(`
              SELECT id, slug, name, status, canonical_domain, normalized_domain, created_at
              FROM tools
              WHERE COALESCE(normalized_domain, canonical_domain) = $1
              ORDER BY created_at`, [g.nd]);
            for (const r of rows.rows) {
              console.log(`  ${r.id} slug=${r.slug} status=${r.status} canonical=${r.canonical_domain} normalized=${r.normalized_domain} created=${r.created_at?.toISOString?.()}`);
            }
          }

          const canonDups = await client.query(`
            SELECT lower(canonical_domain) AS cd, count(*)::int AS n FROM tools
            WHERE canonical_domain IS NOT NULL GROUP BY 1 HAVING count(*) > 1 LIMIT 10
          `);
          console.log(`\ncanonical_domain case-insensitive dup groups: ${canonDups.rows.length}`);
          for (const g of canonDups.rows) console.log(`  ${g.cd} x${g.n}`);

          await client.end();
          EOF
