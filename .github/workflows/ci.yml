name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appsearchly_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d appsearchly_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci > dependency.log 2>&1

      - name: Audit Worker runtime configuration
        run: npm run check:runtime

      - name: Validate production deployment contract
        env:
          PUBLIC_SITE_URL: https://appsearchly.com
          DATABASE_URL: postgresql://appsearchly:ci-only-password@db.example.internal:5432/appsearchly
          CLOUDFLARE_HYPERDRIVE_ID: 0123456789abcdef0123456789abcdef
          CLOUDFLARE_API_TOKEN: ci-contract-token
          CLOUDFLARE_ACCOUNT_ID: 0123456789abcdef0123456789abcdef
          ADMIN_API_TOKEN: ci-only-admin-token-0123456789abcdef
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          DATA_SOURCE_MODE: dual
        run: |
          npm run production:preflight:deploy
          npm run production:config
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('wrangler.production.generated.jsonc','utf8'));if(c.account_id!=='0123456789abcdef0123456789abcdef'||c.vars.APP_ENV!=='production'||c.vars.DATA_SOURCE_MODE!=='dual'||c.vars.PUBLIC_SITE_URL!=='https://appsearchly.com'||c.vars.PUBLIC_TURNSTILE_SITE_KEY!=='1x00000000000000000000AA'||c.hyperdrive?.[0]?.binding!=='HYPERDRIVE'||!c.secrets?.required?.includes('ADMIN_API_TOKEN')||!c.secrets?.required?.includes('TURNSTILE_SECRET_KEY'))process.exit(1)"

      - name: Audit legacy tool data
        run: npm run audit:data

      - name: Prepare migration preview
        run: npm run prepare:import

      - name: Apply and repeat PostgreSQL migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/appsearchly_ci
        run: |
          npm run db:migrate
          npm run db:migrate
          TABLE_COUNT=$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('categories','tools','tags','tool_tags','pricing_plans','tool_snapshots','submissions','outbound_clicks','submission_checks','submission_quality_scores','blocked_domains','submission_rate_limits');")
          MIGRATION_COUNT=$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM schema_migrations;")
          test "$TABLE_COUNT" = "12"
          test "$MIGRATION_COUNT" = "2"

      - name: Verify PostgreSQL runtime writes
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/appsearchly_ci
        run: node scripts/test-postgres-runtime.mjs

      - name: Test submission security and quality contracts
        run: npm run test:submission-quality

      - name: Validate runtime scripts
        run: |
          node --check scripts/render-production-config.mjs
          node --check scripts/production-preflight.mjs
          node --check scripts/migrate-database.mjs
          node --check scripts/smoke-production.mjs
          node --check scripts/test-submission-quality.mjs

      - name: Type and Svelte checks (migration diagnostic)
        continue-on-error: true
        run: npm run check

      - name: Build Cloudflare Worker
        run: npm run build > build.log 2>&1

      - name: Validate production Wrangler upload bundle
        env:
          ADMIN_API_TOKEN: ci-only-admin-token-0123456789abcdef
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
        run: |
          node -e "const fs=require('node:fs');fs.writeFileSync('.wrangler.secrets.json',JSON.stringify({ADMIN_API_TOKEN:process.env.ADMIN_API_TOKEN,TURNSTILE_SECRET_KEY:process.env.TURNSTILE_SECRET_KEY}),{mode:0o600})"
          npx wrangler deploy --dry-run --config wrangler.production.generated.jsonc --secrets-file .wrangler.secrets.json --outdir tmp/wrangler-production-bundle > wrangler-dry-run.log 2>&1
          rm -f .wrangler.secrets.json

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            dependency.log
            build.log
            wrangler-dry-run.log
            tmp/wrangler-production-bundle
            tmp/tool-import-preview.json
          if-no-files-found: ignore
          retention-days: 7
