name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appsearchly_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d appsearchly_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh dependency lock
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts > dependency.log 2>&1

      - name: Commit validated dependency lock
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/p0-3-runtime'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency lock is already current."
          else
            git commit -m "lock Cloudflare runtime dependencies"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Install dependencies
        run: npm ci

      - name: Audit Worker runtime configuration
        run: npm run check:runtime

      - name: Audit legacy tool data
        run: npm run audit:data

      - name: Prepare migration preview
        run: npm run prepare:import

      - name: Apply PostgreSQL migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d appsearchly_ci -v ON_ERROR_STOP=1 -f db/migrations/0001_initial.sql
          TABLE_COUNT=$(psql -h 127.0.0.1 -U postgres -d appsearchly_ci -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('categories','tools','tags','tool_tags','pricing_plans','tool_snapshots','submissions','outbound_clicks');")
          test "$TABLE_COUNT" = "8"

      - name: Verify PostgreSQL runtime writes
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/appsearchly_ci
        run: node scripts/test-postgres-runtime.mjs

      - name: Type and Svelte checks (migration diagnostic)
        continue-on-error: true
        run: npm run check

      - name: Build Cloudflare Worker
        run: npm run build > build.log 2>&1

      - name: Upload P0.3 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-3-diagnostics
          path: |
            dependency.log
            build.log
            package-lock.json
            tmp/tool-import-preview.json
          if-no-files-found: ignore
          retention-days: 7
