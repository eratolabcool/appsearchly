name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # production 环境提供 CLOUDFLARE_API_TOKEN：构建期 prerender 时 [ai] binding 需要远程代理会话
    environment: production
    env:
      E2E_TEST_MODE: true
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appsearchly_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d appsearchly_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci > dependency.log 2>&1

      - name: Audit Worker runtime configuration
        run: npm run check:runtime

      - name: Validate production deployment contract
        env:
          PUBLIC_SITE_URL: https://appsearchly.com
          DATABASE_URL: postgresql://appsearchly:ci-only-password@db.example.internal:5432/appsearchly
          CLOUDFLARE_HYPERDRIVE_ID: 0123456789abcdef0123456789abcdef
          CLOUDFLARE_API_TOKEN: ci-contract-token
          CLOUDFLARE_ACCOUNT_ID: 0123456789abcdef0123456789abcdef
          ADMIN_API_TOKEN: ci-only-admin-token-0123456789abcdef
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000AA
          LARK_WEBHOOK_URL: https://hooks.example.invalid/ci-fake
          DATA_SOURCE_MODE: dual
        run: |
          npm run production:preflight:deploy
          npm run production:config

      - name: Audit legacy tool data
        run: npm run audit:data

      - name: Prepare migration preview
        run: npm run prepare:import

      - name: Apply PostgreSQL migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/appsearchly_ci
        run: npm run db:migrate

      - name: Re-apply PostgreSQL migrations idempotency check
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/appsearchly_ci
        run: npm run db:migrate

      - name: Verify PostgreSQL runtime writes
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/appsearchly_ci
        run: node scripts/test-postgres-runtime.mjs

      - name: Test submission security and quality contracts
        run: npm run test:submission-quality

      - name: Test Turnstile E2E verification
        env:
          E2E_TEST_MODE: true
        run: npm run test:turnstile:e2e

      - name: Test publish workflow E2E
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/appsearchly_ci
          E2E_TEST_MODE: true
        run: npm run test:publish-flow:e2e

      - name: Test AI tools data platform
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/appsearchly_ci
        run: npm run test:tools-data

      - name: Test AI tools acquisition engine
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/appsearchly_ci
          E2E_TEST_MODE: true
        run: npm run test:acquisition

      - name: Test cron automation (auto-approve, notify, articles)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/appsearchly_ci
          E2E_TEST_MODE: true
        run: npm run test:cron-automation

      - name: Test game opportunity radar
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/appsearchly_ci
          E2E_TEST_MODE: true
        run: npm run test:radar

      - name: Validate runtime scripts
        run: |
          node --check scripts/render-production-config.mjs
          node --check scripts/write-worker-entry.mjs
          node --check scripts/production-preflight.mjs
          node --check scripts/migrate-database.mjs
          node --check scripts/smoke-production.mjs
          node --check scripts/test-tool-data-platform.mjs
          node --check scripts/test-acquisition-engine.mjs
          node --check scripts/test-cron-automation.mjs
          node --check scripts/test-radar.mjs
          node --check scripts/test-publish-flow-e2e.mjs
          node --check scripts/test-turnstile-submission-e2e.mjs

      - name: Type and Svelte checks
        continue-on-error: true
        run: npm run check

      - name: Build Cloudflare Worker
        run: npm run build > build.log 2>&1 || (cat build.log && exit 1)

      - name: Validate production Wrangler upload bundle
        env:
          ADMIN_API_TOKEN: ci-only-admin-token-0123456789abcdef
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
          LARK_WEBHOOK_URL: https://hooks.example.invalid/ci-fake
        run: |
          node -e "const fs=require('node:fs');fs.writeFileSync('.wrangler.secrets.json',JSON.stringify({ADMIN_API_TOKEN:process.env.ADMIN_API_TOKEN,TURNSTILE_SECRET_KEY:process.env.TURNSTILE_SECRET_KEY,LARK_WEBHOOK_URL:process.env.LARK_WEBHOOK_URL}),{mode:0o600})"
          npx wrangler deploy --dry-run --config wrangler.production.generated.jsonc --secrets-file .wrangler.secrets.json --outdir tmp/wrangler-production-bundle > wrangler-dry-run.log 2>&1
          rm -f .wrangler.secrets.json
